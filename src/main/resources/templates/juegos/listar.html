<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Listado de juegos</title>
</head>
<body>
<main>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Listado de juegos</h1>
        <a class="btn btn-primary" th:href="@{/juegos/nuevo}">Nuevo juego</a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Desarrollador</th>
                <th>Tamano</th>
                <th>Anio</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="juego : ${juegos}">
                <td th:text="${juego.nombre}"></td>
                <td th:text="${juego.desarrollador}"></td>
                <td th:text="${juego.tamanoGb} + ' GB'"></td>
                <td th:text="${juego.anioCreacion}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/juegos/editar/{id}(id=${juego.id})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger"
                       th:href="@{/juegos/eliminar/{id}(id=${juego.id})}">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(juegos)}">
                <td colspan="5" class="text-center text-muted">No hay juegos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>

</main>
</body>
</html>
